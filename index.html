<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf4f1" />
    <!-- iOS home-screen label (it otherwise takes the longer <title>). -->
    <meta name="apple-mobile-web-app-title" content="WuWa Opt" />
    <!-- Icon fetches to encore.moe must not carry the page URL. The
         Content-Security-Policy meta is injected at build time (vite.config.ts). -->
    <meta name="referrer" content="no-referrer" />
    <script>
      try {
        var t = localStorage.getItem('wuwa-theme');
        if (t === 'ink' || t === 'paper') {
          document.documentElement.dataset.theme = t;
          if (t === 'ink') document.querySelector('meta[name="theme-color"]').content = '#1a1726';
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="WuWa Optimizer — a local-first Echo inventory and damage optimizer for Wuthering Waves."
    />
    <title>WuWa Optimizer</title>
    <!-- Canonical address: SITE_URL is CANONICAL_URL from src/site.ts (substituted by vite.config.ts). -->
    <link rel="canonical" href="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WuWa Optimizer" />
    <meta
      property="og:description"
      content="Local-first Echo inventory and damage optimizer for Wuthering Waves. Your data stays in your browser."
    />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%aemeath-ames-still.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
